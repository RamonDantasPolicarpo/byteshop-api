services:
  db:
    image: postgres:15
    container_name: byteshop-db
    networks:
      - byteshop-net
    environment:
      POSTGRES_DB: byteshop_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d

  api:
    build: .
    container_name: byteshop-api
    networks:
      - byteshop-net
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/byteshop_ecommerce
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root

networks:
  byteshop-net:
    driver: bridge